<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEN Bot - Invite</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: #121212;
            min-height: 100vh;
            padding-bottom: 80px;
        }

        .referral-section {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .referral-link {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .referral-link input {
            flex: 1;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #222;
            color: white;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.3s;
        }

        .copy-btn {
            background: #4CAF50;
            color: white;
        }

        .share-btn {
            background: #2196F3;
            color: white;
        }

        .stats-section {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #222;
            border-radius: 8px;
            padding: 16px;
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            color: #4CAF50;
            margin-bottom: 8px;
        }

        .stat-label {
            color: #888;
            font-size: 14px;
        }

        .level-section {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .level-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .level-title {
            color: white;
            font-size: 18px;
        }

        .level-percentage {
            color: #4CAF50;
            font-size: 16px;
        }

        .level-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .level-stat {
            background: #222;
            border-radius: 8px;
            padding: 12px;
        }

        .level-stat-value {
            color: white;
            font-size: 18px;
            margin-bottom: 4px;
        }

        .level-stat-label {
            color: #888;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="referral-section">
            <h2>Your Referral Link</h2>
            <div class="referral-link">
                <input type="text" id="referralLink" readonly>
                <div class="action-buttons">
                    <button id="copyLinkBtn" class="action-btn copy-btn">
                        <img src="icons/copy.svg" alt="Copy">
                        <span>Copy</span>
                    </button>
                    <button id="shareLinkBtn" class="action-btn share-btn">
                        <img src="icons/share.svg" alt="Share">
                        <span>Share</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="stats-section">
            <div class="stat-card">
                <div class="stat-value" id="totalEarnings">0.000000</div>
                <div class="stat-label">Total Earnings (GEN)</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalReferrals">0</div>
                <div class="stat-label">Total Referrals</div>
            </div>
        </div>

        <div class="level-section">
            <div class="level-header">
                <div class="level-title">Level 1 Referrals</div>
                <div class="level-percentage">4% Commission</div>
            </div>
            <div class="level-stats">
                <div class="level-stat">
                    <div class="level-stat-value" id="level1Count">0</div>
                    <div class="level-stat-label">Direct Referrals</div>
                </div>
                <div class="level-stat">
                    <div class="level-stat-value" id="level1Earnings">0.000000</div>
                    <div class="level-stat-label">Earnings (GEN)</div>
                </div>
            </div>
        </div>

        <div class="level-section">
            <div class="level-header">
                <div class="level-title">Level 2 Referrals</div>
                <div class="level-percentage">2% Commission</div>
            </div>
            <div class="level-stats">
                <div class="level-stat">
                    <div class="level-stat-value" id="level2Count">0</div>
                    <div class="level-stat-label">Indirect Referrals</div>
                </div>
                <div class="level-stat">
                    <div class="level-stat-value" id="level2Earnings">0.000000</div>
                    <div class="level-stat-label">Earnings (GEN)</div>
                </div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <img src="icons/home.svg" alt="Home">
            <span>Home</span>
        </a>
        <a href="markets.html" class="nav-item">
            <img src="icons/markets.svg" alt="Markets">
            <span>Markets</span>
        </a>
        <a href="invite.html" class="nav-item active">
            <img src="icons/invite.svg" alt="Invite">
            <span>Invite</span>
        </a>
        <a href="earn.html" class="nav-item">
            <img src="icons/earn.svg" alt="Earn">
            <span>Earn</span>
        </a>
        <a href="wallet.html" class="nav-item">
            <img src="icons/wallet.svg" alt="Wallet">
            <span>Wallet</span>
        </a>
    </nav>

    <script src="navigation.js"></script>
    <script src="referral.js"></script>
    <script>
        // Initialize Telegram Web App
        const webApp = window.Telegram.WebApp;
        
        // Expand the web app to full height
        webApp.expand();

        // Handle theme changes
        webApp.onEvent('themeChanged', () => {
            document.body.classList.toggle('dark', webApp.colorScheme === 'dark');
        });

        // Set initial theme
        document.body.classList.toggle('dark', webApp.colorScheme === 'dark');

        // Initialize referral system with user ID
        const user = webApp.initDataUnsafe.user;
        if (user) {
            referralSystem.init(user.id);
        }

        // Handle referral registration if coming from a referral link
        const referrerId = referralSystem.getReferralData();
        if (referrerId && user) {
            referralSystem.handleRegistration(user.id, referrerId)
                .catch(err => console.error('Error registering referral:', err));
        }
    </script>
</body>
</html>
